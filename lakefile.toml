name = "perclib"
version = "0.1.0"
defaultTargets = ["PercLib"]

[leanOptions]
autoImplicit = false
# mathlib's standard linter set (Mathlib/Init.lean, `linter.mathlibStandardSet`), as mathlib's
# own lakefile enables it. Three of its linters stay off until their fallout is decided:
# `style.header` (six adapted files keep their upstream notices), and
# `unusedFintypeInType` / `unusedDecidableInType` (clearing them changes statements).
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false
weak.linter.unusedFintypeInType = false
weak.linter.unusedDecidableInType = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "56a005855ea17e0b0958f73ec801ae140b0a1679"

[[lean_lib]]
name = "PercLib"
